# Configuracion del cluster F40. Se puede cambiar sin tocar el codigo.
# Las rutas son relativas a la carpeta del proyecto.

[rutas]
datos = datos/vehiculo.conf
logs = logs
# Kilometraje del odometro (se crea al guardar; tiene un respaldo .bak).
odometro = datos/odometro.txt
# Caja negra: anillo binario de tamano fijo con los ultimos segundos del vehiculo.
caja_negra = datos/caja_negra.bin

[intervalos]
# Cada cuanto el hilo lector relee el archivo de datos.
lectura_ms = 100
# Cada cuanto la interfaz aplica los datos, avanza el estado y redibuja.
refresco_ms = 50

[bitacora]
# Tamano maximo de cada bitacora antes de rotar y cuantos respaldos se guardan.
max_bytes = 262144
respaldos = 3

[rangos]
# minimo, maximo. Pueden estrecharse, nunca salir del rango de la especificacion.
velocidad = 0, 360
rpm = 0, 9000
presion_aceite = 0, 10
temp_agua = 40, 130
presion_turbo = 0, 2

[odometro]
# Cada cuanto se guarda el kilometraje (tambien se guarda al cerrar).
guardar_cada_s = 5

[caja_negra]
# Segundos que conserva (el archivo no crece), muestras por segundo y eventos CSV que se guardan.
segundos = 60
frecuencia_hz = 10
eventos_max = 20
