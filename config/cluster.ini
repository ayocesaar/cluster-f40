# Configuracion del cluster F40. Se puede cambiar sin tocar el codigo.
# Las rutas son relativas a la carpeta del proyecto.

[rutas]
datos = datos/vehiculo.conf
logs = logs

[intervalos]
# Cada cuanto el hilo lector relee el archivo de datos.
lectura_ms = 100
# Cada cuanto la interfaz aplica los datos, avanza el estado y redibuja.
refresco_ms = 50

[bitacora]
# Tamano maximo de cada bitacora antes de rotar y cuantos respaldos se guardan.
max_bytes = 262144
respaldos = 3

[rangos]
# minimo, maximo. Pueden estrecharse, nunca salir del rango de la especificacion.
velocidad = 0, 360
rpm = 0, 9000
presion_aceite = 0, 10
temp_agua = 40, 130
presion_turbo = 0, 2
